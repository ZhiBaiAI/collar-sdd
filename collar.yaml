# collar.yaml — 给 AI 套「项圈」的三层声明
#
# 心智模型：
#   Identity   —— 你是谁、先读什么、按需读什么   （管「知道什么」）
#   Boundary   —— 能改什么、不能改什么           （管「能改什么」，default: deny）
#   Validation —— 分级门禁与质量验证命令         （管「改得对不对」）
#
# 本文件是声明式的「唯一契约」。落地时按项目替换 ⟨⟩ 占位符并收紧 allow_write。

version: 1

identity:
  role: "⟨本项目⟩ 的研发 Agent"
  entry: AGENTS.md                 # 唯一入口，只做导航（结构判据见 collar-check S1）
  knowledge_base: docs/            # 知识库目录（specs / architecture / runbook 为核心）
  # 每次会话最小必读集（严格控制体积，避免常驻上下文膨胀）
  must_read:
    - AGENTS.md
    - docs/runbook/conventions.md  # 高密度编码红线
  # 按需加载：命中场景才读
  lazy_read:
    - when: "Standard/Major 改动涉及新建或修改功能规格"
      read: docs/specs/README.md
    - when: "改动涉及架构、依赖或跨模块契约"
      read: docs/architecture/README.md
    - when: "改动涉及外部依赖或参考实现"
      read: docs/vendor/SOURCES.md
    - when: "排查预发/线上不一致"
      read: docs/runbook/environments.md
    - when: "跨会话长任务需要交接或续接"
      read: docs/runbook/handoff.md

boundary:
  default: deny                    # 未命中 allow_write 的暂存文件由 collar-boundary.sh 真实拦截
  allow_write:
    - "AGENTS.md"
    - "README*.md"
    - "CHANGELOG.md"
    - "VERSION"
    - "LICENSE"
    - ".gitignore"
    - "collar.yaml"
    - "CONTRIBUTING.md"
    - ".github/**"
    - ".agents/**"                 # 跨工具通用 Skill 软链目录（collar-init 自动创建）
    - "docs/**"                    # 知识库可写
    - "src/**"                     # 项目源码（含测试）
    - "scripts/**"                 # 门禁与工具脚本
    - "skills/**"                  # 项目级 Skill
    # 落地时按技术栈补充构建配置文件，例如："package.json"、"tsconfig.json"、"Makefile"
  deny_write:                      # 硬禁区（优先级高于 allow_write，由 collar-boundary.sh 强制拦截）
    - ".git/**"
    - ".env"
    - ".env.*"
    - "⟨锁文件 / 产物目录 / 已应用的迁移脚本⟩"
  deny_command:                    # 运行期危险命令黑名单（策略声明；需由宿主工具/沙箱在执行前拦截）
    - "git push --force*"
    - "git reset --hard*"
    - "rm -rf *"
  # 只读可达通道：外置到 DB/平台的逻辑，用 MCP 拉回 AI 视野（见 context-stitching.md）
  read_only_channels:
    - name: "⟨外部配置/提示词平台⟩ MCP"
      purpose: "查询当前实际生效的动态配置，避免推理链断裂"
      skill: "⟨配套 skill，定义何时查/怎么查/查到怎么用⟩"
      access: read-only

  # 角色化边界（多角色/平台沙箱按需启用；dev 继承上方 allow/deny）
  roles:
    dev:
      default: true
    non-dev:                          # 产品 / 设计 / 测试等无直接合库权限的角色
      allow_write:
        - "docs/specs/**/PROPOSAL-*.md"
        - "docs/wiki/**"
      deny_command:
        - "git push*"
        - "git commit*"
        - "git merge*"
      changes_via: proposal

validation:
  # 门禁分两类：
  #   structure —— 知识库结构与边界门禁（语言无关，复制即真实拦截）
  #   quality   —— 代码质量门禁，按 stage 分三档，避免每次小改或复查都跑全量构建：
  #                fast    = 改后快检 / 审 diff（秒级：改动文件 lint + 关联测试）
  #                commit  = pre-commit 拦截（typecheck + unit）
  #                release = 发版 / 架构大改（全量构建 + 全量测试 / E2E / 可选 Eval）
  gates:
    # ---- structure（开箱即拦截）----
    - name: collar-check
      cmd: "sh scripts/collar-check.sh"
      kind: structure
      stage: commit
      owner: collar-runbook
    - name: collar-boundary
      cmd: "sh scripts/collar-boundary.sh"
      kind: structure
      stage: commit
      owner: collar-runbook
    - name: spec-diff-report       # Standard/Major 提交时由 Agent 执行（只报不改）
      rule: "只输出差异清单交人决策，禁止自动反向修改 Spec"
      owner: collar-specs
    - name: context-stitch-check   # 外置逻辑改动时检查
      rule: "逻辑外置出代码必须同步缝补（MCP / //! 锚点 / ADR 登记）"
      owner: collar-architecture
    # ---- quality（⟨占位⟩，落地时按技术栈装配）----
    - name: lint-changed
      cmd: "⟨make lint-changed⟩"
      kind: quality
      stage: fast
    - name: test-changed
      cmd: "⟨make test-changed⟩"
      kind: quality
      stage: fast
    - name: typecheck
      cmd: "⟨make typecheck⟩"
      kind: quality
      stage: commit
    - name: test-unit
      cmd: "⟨make test-unit⟩"
      kind: quality
      stage: commit
    - name: build-and-full-test
      cmd: "⟨make build && make test⟩"
      kind: quality
      stage: release
  on_gate_failure: block            # block | warn

# ---------------------------------------------------------------------------
# authoring —— 写作规则一处真相（各 Skill 按此生成文档，避免多处抄写漂移）
# ---------------------------------------------------------------------------
authoring:
  context: |
    ⟨项目背景：技术栈 / 语言约定 / 领域口径⟩
  rules:
    feature:
      - "简单功能只填核心 4 节（目标边界 / 契约影响面 / 编号 AC-N 含验证路径 / 待确认），不填冗余空表"
      - "每条 AC 编号 AC-N 且不复用，必须可观测可判定；tests.md 为可选伴生文档，简单功能在 spec 内联验证映射即可"
      - "写不准的事实进待确认表，禁止猜测填充"
    patch:
      - "patch 自身可独立阅读，且必须与主文档建立双向指针"
      - "§⑥ 验收标准用 Delta 四段：ADDED（AC-P 编号）/ MODIFIED / REMOVED / RENAMED（FROM→TO 成对）"
      - "同一 AC-N 不跨 delta 小节；没有内容的小节整节删除；收敛走 collar-converge.sh"
    changelog:
      - "日常提交依靠规范 commit message，按需运行 scripts/collar-changelog.sh 从 git log 生成"
      - "BREAKING 变更或里程碑发版显式记录并写明迁移方式"
    runbook:
      - "单次偶然踩坑不入规，重复踩坑或关键红线才沉淀；结论先于现象，现状文档只写现在时"
